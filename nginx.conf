server {
    listen 80;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=()" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'wasm-unsafe-eval' https://sdk.cashfree.com https://*.razorpay.com https://cdn.moengage.com https://apis.google.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://uicdn.toast.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: blob: https:;
        media-src 'self' blob:;
        worker-src 'self' blob:;
        connect-src 'self' https://inapi.peko.one https://uatinapi.pekoapp.com https://sockjs-ap2.pusher.com wss://ws-ap2.pusher.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebasestorage.googleapis.com https://*.moengage.com https://*.cashfree.com https://*.razorpay.com https://nominatim.openstreetmap.org https://api.bigdatacloud.net;
        frame-src 'self' https:;
        frame-ancestors 'self';
        form-action 'self' https://*.cashfree.com https://secure.ccavenue.com;
        base-uri 'self';
        object-src 'none';
        manifest-src 'none';
    " always;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
