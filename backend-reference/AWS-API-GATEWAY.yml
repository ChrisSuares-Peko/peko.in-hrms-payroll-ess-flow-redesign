trigger:
  branches:
   include: 
    - staging
  paths:
    include:
      - api-gateway/*

variables:
  AWS_REGION: 'ap-south-1'            # <— Mumbai
  ECR_REPO: 'api-gateway'
  ECS_CLUSTER: 'peko-uat-in-cluster'
  ECS_SERVICE: 'api-gateway-service-jhy8uwrc'
  CONTAINER_NAME: 'api-gateway'
  DOCKERFILE: 'api-gateway/dockerfile'
  CONTEXT: 'api-gateway'
  IMAGE_TAG: '$(Build.BuildId)-$(Build.SourceVersionShort)'

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: BuildPush
  displayName: Build & Push to ECR
  jobs:
  - job: BuildAndPush
    steps:
    - checkout: self
      clean: true

    - task: Bash@3
      displayName: Install AWS CLI + jq
      inputs:
        targetType: inline
        script: |
          sudo apt-get update -y
          sudo apt-get install -y unzip jq
          curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version

    # ---------- Auth (pick ONE) ----------
    # [A] OIDC service connection via AWS Toolkit
    # - task: AWSShellScript@1
    #   inputs:
    #     awsCredentials: 'REDACTED'
    #     regionName: '$(AWS_REGION)'
    #     scriptType: 'inline'
    #     inlineScript: 'aws sts get-caller-identity'

    # [B] Access keys (Variable Group secrets)
    - task: Bash@3
      displayName: Configure AWS creds
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      inputs:
        targetType: inline
        script: |
          aws configure set region $(AWS_REGION)
          aws sts get-caller-identity

    - task: Bash@3
      displayName: Login to ECR
      inputs:
        targetType: inline
        script: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          aws ecr get-login-password --region $(AWS_REGION) \
            | docker login --username AWS --password-stdin ${ACCOUNT_ID}.dkr.ecr.$(AWS_REGION).amazonaws.com
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $(Pipeline.Workspace)/env.out

    - task: Bash@3
      displayName: Docker build & push
      inputs:
        targetType: inline
        script: |
          source $(Pipeline.Workspace)/env.out
          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.$(AWS_REGION).amazonaws.com/$(ECR_REPO)"
          DOCKER_BUILDKIT=1 docker build -f $(DOCKERFILE) -t ${IMAGE_URI}:$(IMAGE_TAG) $(CONTEXT)
          docker push ${IMAGE_URI}:$(IMAGE_TAG)
          docker tag ${IMAGE_URI}:$(IMAGE_TAG) ${IMAGE_URI}:latest
          docker push ${IMAGE_URI}:latest
          echo "IMAGE_URI=${IMAGE_URI}:$(IMAGE_TAG)" >> $(Pipeline.Workspace)/env.out


- stage: Deploy
  dependsOn: BuildPush
  jobs:
  - job: ECSUpdate
    steps:
    - bash: |
        source $(Pipeline.Workspace)/env.out
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.$(AWS_REGION).amazonaws.com/$(ECR_REPO):$(IMAGE_TAG)"

        # Get current task def arn
        TASK_DEF_ARN=$(aws ecs describe-services \
          --cluster $(ECS_CLUSTER) --services $(ECS_SERVICE) \
          --region $(AWS_REGION) --query 'services[0].taskDefinition' --output text)

        # Pull its JSON, swap the image
        aws ecs describe-task-definition --task-definition "$TASK_DEF_ARN" \
          --region $(AWS_REGION) --query 'taskDefinition' > taskdef.json

        cat taskdef.json \
          | jq 'del(.status,.taskDefinitionArn,.requiresAttributes,.revision,.registeredAt,.registeredBy,.compatibilities,.runtimePlatform.cpuArchitecture,.runtimePlatform.operatingSystemFamily)' \
          | jq ".containerDefinitions |= map(if .name==\"$(CONTAINER_NAME)\" then .image = \"$IMAGE_URI\" else . end)" \
          > new-taskdef.json

        NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://new-taskdef.json --region $(AWS_REGION) \
          --query 'taskDefinition.taskDefinitionArn' --output text)

        aws ecs update-service --cluster $(ECS_CLUSTER) --service $(ECS_SERVICE) \
          --region $(AWS_REGION) --task-definition "$NEW_TASK_DEF_ARN"

        aws ecs wait services-stable --cluster $(ECS_CLUSTER) --services $(ECS_SERVICE) --region $(AWS_REGION)
        echo "Deployed $IMAGE_URI"
      displayName: Update ECS service to new image